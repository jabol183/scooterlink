name: Verify iOS App Store music build

# Manual only: avoids consuming macOS Actions minutes on every PR.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check public API source
        shell: bash
        run: |
          if grep -RnE '(MRMediaRemote|dlopen\(|dlsym\(|PrivateFrameworks/MediaRemote)' App/Sources; then
            echo 'Private media framework usage is not allowed'
            exit 1
          fi
      - name: Test public Shortcuts URL helper
        shell: bash
        run: |
          cd App
          swiftc Sources/ShortcutURL.swift Tests/Shortcuts/main.swift -o /tmp/shortcut-url-tests
          /tmp/shortcut-url-tests
      - name: Generate Xcode project
        run: cd App && xcodegen generate
      - name: Build unsigned Release for iOS
        shell: bash
        run: |
          cd App
          xcodebuild -project ScooterLink.xcodeproj -scheme ScooterLink \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
